# MkDocs 站点配置
# 本地预览：  pip install -r requirements.txt && mkdocs serve
# 严格构建：  mkdocs build --strict

site_name: RSI 文献精读
site_description: 递归自我改进（Recursive Self-Improvement）论文精读笔记 —— 哥德尔机、自我改进智能体、零数据自博弈、进化搜索等 49 篇
site_author: 李子林
# 站点地址与仓库链接（已按 GitHub 用户 zlven 配置）
site_url: https://zlven.github.io/RSI-Papers-Reading/
repo_url: https://github.com/zlven/RSI-Papers-Reading
repo_name: RSI-Papers-Reading
edit_uri: edit/main/docs/
copyright: 内容采用 CC BY 4.0 许可协议

theme:
  name: material
  language: zh
  features:
    - navigation.instant      # 站内跳转不整页刷新
    - navigation.tracking     # 地址栏跟随滚动更新锚点
    - navigation.sections     # 顶级分组常驻展开
    - navigation.top          # 回到顶部按钮
    - navigation.footer       # 底部上一页/下一页
    - toc.follow              # 右侧目录跟随滚动高亮
    - search.suggest          # 搜索联想
    - search.highlight        # 搜索命中高亮
    - content.code.copy       # 代码块一键复制
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

plugins:
  # 中文全文检索：Material 的 search 插件在检测到已安装 jieba 时自动启用中文分词，
  # jieba 已写入 requirements.txt。separator 用于兜底切分中英混排文本。
  - search:
      separator: '[\s​\-,:!=\[\]()"/]+|\.(?!\d)|&[lg]t;'
      lang:
        - zh
        - en

markdown_extensions:
  - tables                # 全文 860 行表格依赖此项
  - toc:
      permalink: true     # 各级标题生成可复制的锚点链接
      toc_depth: 3
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  # ⚠️ 切勿添加 pymdownx.arithmatex：笔记中的 $15 / $1.91 / $5000 / $22k
  #    是货币金额而非数学公式，启用后会被逐对匹配成数学式从而排版错乱。
  #    实测全文 $$ 出现 0 次，无需数学渲染。

# 导航由 scripts/gen_nav.py 依据 docs/ 下的文件名自动生成，
# 新增笔记后运行 `python scripts/gen_nav.py` 即可，请勿手工编辑下方区块。
